name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimplePDFReader-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (direct download link)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="apk-$(echo "$BRANCH" | tr '/' '-')"
          cp app/build/outputs/apk/debug/app-debug.apk SimplePDFReader.apk
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" SimplePDFReader.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "APK ($BRANCH)" \
            --notes "Latest debug build from branch $BRANCH, commit $GITHUB_SHA"
